<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540">
  <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#d4d4d4}.muted{fill:#9d9d9d}.small{font-size:12px}.title{font-size:15px;font-weight:700}.panel{fill:#1f1f1f;stroke:#333}.input{fill:#181818;stroke:#3a3a3a}</style>
  <rect width="1200" height="540" fill="#111"/><rect x="24" y="24" width="1152" height="460" class="panel"/><rect x="24" y="24" width="1152" height="54" fill="#181818" stroke="#333"/><text x="42" y="56" class="title">Conexión con SonarQube</text><text x="1150" y="56" text-anchor="end" class="small muted">La configuración se guarda por carpeta del workspace</text>
  <text x="44" y="112" class="small"><tspan fill="#ff625e">*</tspan> Servidor SonarQube</text><rect x="44" y="124" width="430" height="36" class="input"/><text x="58" y="147" class="small">https://sonarqube.example.com</text>
  <text x="500" y="112" class="small"><tspan fill="#ff625e">*</tspan> Token</text><rect x="500" y="124" width="430" height="36" class="input"/><text x="514" y="147" class="small muted">Token guardado · escribe otro para sustituirlo</text><rect x="950" y="124" width="195" height="36" rx="3" fill="#2788b5"/><text x="1047" y="147" text-anchor="middle" class="small">Conectar y cargar proyectos</text>
  <text x="44" y="203" class="small"><tspan fill="#ff625e">*</tspan> Proyecto o aplicación visible</text><rect x="44" y="215" width="886" height="36" class="input"/><text x="58" y="238" class="small">demo-application — Proyecto</text><rect x="950" y="215" width="195" height="36" rx="3" fill="#2788b5"/><text x="1047" y="238" text-anchor="middle" class="small">Guardar y sincronizar</text><text x="44" y="274" class="small muted">El desplegable incluye únicamente los componentes visibles para el token.</text>
  <line x1="44" y1="310" x2="1145" y2="310" stroke="#333"/><text x="44" y="342" class="small muted">▶ Configuración avanzada</text>
  <line x1="24" y1="382" x2="1176" y2="382" stroke="#333"/><text x="58" y="425" class="small">Actualizar issues</text><text x="190" y="425" class="small">Limpiar Problems</text><text x="1145" y="425" text-anchor="end" class="small muted">Configurado: demo-application</text>
  <text x="24" y="520" class="small muted">El token se almacena mediante SecretStorage y no se escribe en settings.json.</text>
</svg>
