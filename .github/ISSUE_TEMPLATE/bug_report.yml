name: Bug report
description: Report a reproducible extension problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Remove tokens, credentials, and private source code before submitting."
  - type: input
    id: version
    attributes:
      label: Extension version
    validations:
      required: true
  - type: input
    id: vscode
    attributes:
      label: VS Code version and operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics report and logs
      description: Use Diagnostics > Copy report and verify that no private data remains.
