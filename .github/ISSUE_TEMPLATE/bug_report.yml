name: Bug report
description: Informa de un problema con la extensión
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: ¿Qué ha pasado?
      description: Describe brevemente el problema.
      placeholder: Ej. Al ejecutar el pipeline aparece un error...
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnóstico (opcional)
      description: Si llegaste desde "Contactar soporte", pega aquí con Ctrl+V el diagnóstico copiado automáticamente.
      render: text
    validations:
      required: false
