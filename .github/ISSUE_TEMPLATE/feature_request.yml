name: Feature request
description: Propón una mejora para la extensión
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: feature
    attributes:
      label: ¿Qué te gustaría?
      description: Describe brevemente la mejora.
      placeholder: Ej. Me gustaría poder...
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: ¿Por qué te sería útil? (opcional)
      placeholder: Ej. Me ahorraría...
    validations:
      required: false
