name: Publish Marketplace

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PUBLISH to continue
        required: true

permissions:
  contents: read

jobs:
  publish:
    if: github.event.inputs.confirm == 'PUBLISH'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Publish to Visual Studio Marketplace
        run: npx --yes @vscode/vsce publish --pat "${{ secrets.VSCE_PAT }}"
